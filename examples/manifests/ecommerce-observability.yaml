apiVersion: v1
kind: Namespace
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: commerce
data:
  API_URL: "http://checkout-api:8080"
  CURRENCY: "EUR"
---
apiVersion: v1
kind: Secret
metadata:
  name: commerce-secrets
  namespace: commerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://commerce:commerce@postgres:5432/commerce"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: commerce
  labels:
    app: storefront
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: customer-experience
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: customer-experience
    spec:
      containers:
        - name: storefront
          image: ghcr.io/example/storefront:latest
          envFrom:
            - configMapRef:
                name: storefront-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: commerce
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: commerce
  labels:
    app: checkout-api
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: commerce-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: commerce-core
    spec:
      containers:
        - name: checkout-api
          image: ghcr.io/example/checkout-api:latest
          envFrom:
            - secretRef:
                name: commerce-secrets
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: commerce
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: commerce
  labels:
    app: order-worker
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/part-of: commerce-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/part-of: commerce-core
    spec:
      containers:
        - name: order-worker
          image: ghcr.io/example/order-worker:latest
          envFrom:
            - secretRef:
                name: commerce-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: commerce
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: data-services
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: commerce
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: commerce
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: data-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: data-services
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: commerce
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: commerce
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: commerce
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: commerce
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: commerce
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce
  namespace: commerce
spec:
  rules:
    - host: commerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

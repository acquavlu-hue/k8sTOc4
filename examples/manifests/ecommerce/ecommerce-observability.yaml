apiVersion: v1
kind: Namespace
metadata:
  name: commerce
  labels:
    app.kubernetes.io/name: commerce
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: storefront
data:
  CHECKOUT_URL: "http://checkout.commerce.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: payments
type: Opaque
stringData:
  PROVIDER_TOKEN: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: commerce
  labels:
    app: storefront
    app.kubernetes.io/part-of: storefront
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/part-of: storefront
    spec:
      containers:
        - name: storefront
          image: ghcr.io/example/storefront:2.4.0
          envFrom:
            - configMapRef:
                name: storefront-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: storefront
spec:
  selector:
    app: storefront
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: commerce
  labels:
    app: checkout
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/part-of: checkout
    spec:
      containers:
        - name: checkout
          image: ghcr.io/example/checkout:1.9.0
          env:
            - name: PAYMENT_URL
              value: "http://payments.commerce.svc.cluster.local"
            - name: REDIS_HOST
              value: "cart-cache"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: checkout
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: commerce
  labels:
    app: payments
    app.kubernetes.io/part-of: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/part-of: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/example/payments:3.1.0
          envFrom:
            - secretRef:
                name: payment-secrets
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: payments
spec:
  selector:
    app: payments
  ports:
    - port: 80
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-cache
  namespace: commerce
  labels:
    app: cart-cache
    app.kubernetes.io/part-of: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-cache
  template:
    metadata:
      labels:
        app: cart-cache
        app.kubernetes.io/part-of: checkout
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cart-cache
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: checkout
spec:
  selector:
    app: cart-cache
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: commerce
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: storefront
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
          - path: /checkout
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          ports:
            - containerPort: 9090
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

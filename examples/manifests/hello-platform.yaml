apiVersion: v1
kind: Namespace
metadata:
  name: hello-platform
  labels:
    app.kubernetes.io/name: hello-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: hello-platform
data:
  API_BASE_URL: "http://api"
  FEATURE_FLAGS: "docs-placeholder,landing-page"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: hello-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@db:5432/hello"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hello-platform
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: hello-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: hello-platform
    spec:
      containers:
        - name: web
          image: ghcr.io/example/hello-web:latest
          envFrom:
            - configMapRef:
                name: web-config
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hello-platform
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hello-platform
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: hello-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: hello-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/example/hello-api:latest
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hello-platform
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: hello-platform
  labels:
    app: db
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: hello-platform
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: hello-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: hello
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: hello-platform
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: hello-platform
spec:
  rules:
    - host: hello-platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
